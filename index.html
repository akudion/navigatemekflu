<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Praktikum Selesai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Overlay Latar Belakang Blur */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      animation: fadeIn 0.3s forwards ease-in-out;
    }

    /* Container Card Pop-Up */
    .popup-card {
      background: #ffffff;
      width: 90%;
      max-width: 450px;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      transform: scale(0.8);
      animation: popUp 0.3s forwards ease-in-out 0.1s;
    }

    /* Ikon Peringatan / Info */
    .popup-icon {
      width: 64px;
      height: 64px;
      background-color: #fee2e2;
      color: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 32px;
      font-weight: bold;
    }

    /* Judul */
    .popup-card h2 {
      color: #1f2937;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    /* Deskripsi Teks */
    .popup-card p {
      color: #4b5563;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Aksentuasi Teks Highlight */
    .popup-card p strong {
      color: #dc2626;
    }

    /* Tombol Paham / Tutup */
    .btn-close {
      width: 100%;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-close:hover {
      background-color: #1d4ed8;
    }

    /* Keyframe Animasi */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes popUp {
      to {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Overlay & Pop-Up -->
  <div class="popup-overlay" id="popupNotice">
    <div class="popup-card">
      <div class="popup-icon">!</div>
      <h2>Pemberitahuan Praktikum</h2>
      <p>
        Website ini <strong>sudah tidak dapat digunakan</strong> karena rangkaian kegiatan <strong>Praktikum telah selesai</strong>. 
      </p>
      <p style="font-size: 0.85rem; color: #6b7280; margin-top: -12px; margin-bottom: 20px;">
        Terima kasih atas partisipasi dan kerja samanya selama periode praktikum berlangsung.
      </p>
      <button class="btn-close" onclick="closePopup()">Mengerti</button>
    </div>
  </div>

  <script>
    function closePopup() {
      const popup = document.getElementById('popupNotice');
      popup.style.display = 'none';
    }
  </script>

</body>
</html>
